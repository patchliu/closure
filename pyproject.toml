[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "closure"
version = "0.3.0"
description = "Closure: closed-loop from performance analysis to compiler optimization"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
closure = "closure.cli:main"

[tool.setuptools.packages.find]
include = ["closure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]